prompts:
  P0: {category: identity, template: "a photo of a {class_name}"}
  P1: {category: background_change, template: "a photo of a {class_name} on a beach"}
  P2: {category: context_change, template: "a photo of a {class_name} inside a modern kitchen"}
  P3: {category: attribute_change, template: "a photo of a {class_name} with a red accessory"}
  P4: {category: composition_change, template: "a photo of a {class_name} on a wooden table"}
  P5: {category: style_change, template: "a watercolor painting of a {class_name}"}

seeds: [42, 123, 456, 789]

dreamo:
  version: v1.1
  resolution: 768
  inference_steps: 12
  guidance_scale: 4.5
  quantization: int8
  offload: true
  reference_task: ip
  reference_count: 1

uno:
  model_type: flux-dev-fp8
  resolution: 512
  inference_steps: 25
  guidance_scale: 4.0
  offload: true
  lora_rank: 512
  reference_count: 1
